# =========================================================
# APPLICATION
# =========================================================

spring.application.name=StepInStudents

spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties





# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/stepedu_db
spring.datasource.username=root
spring.datasource.password=Jatin@12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_FOR_YOUR_LOCAL_PROJECT_123456789

app.jwt.expiration=86400000


# =========================================================
# FRONTEND
# =========================================================

# Production reset links: APP_FRONTEND_URL=https://stepinstudents.com
# Production CORS allowlist: APP_FRONTEND_ALLOWED_ORIGINS=https://stepinstudents.com
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.frontend.allowed-origins=${APP_FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,https://stepinstudents.com}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# COMMUNITY FEED ? IMAGE UPLOADS
# =========================================================

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=26MB

app.community.upload-dir=uploads/community
